<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c8402f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>拜拜 · baibai</title>
  </head>
  <body>
    <div class="decor" aria-hidden="true">
      <!-- 左上角：新春鎏金绽放礼花 (Blooming Festive Fireworks) -->
      <svg class="decor-item decor-firework" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="fwCenterGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff8e7" stop-opacity="1" />
            <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.8" />
            <stop offset="70%" stop-color="#c8402f" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#c8402f" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="fwGoldLine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#c8402f" stop-opacity="0.2" />
          </linearGradient>
          <linearGradient id="fwRedLine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fca5a5" />
            <stop offset="60%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#991b1b" stop-opacity="0.1" />
          </linearGradient>
        </defs>

        <!-- 柔和中心光晕 -->
        <circle cx="110" cy="110" r="95" fill="url(#fwCenterGlow)" />

        <!-- 主星芒射线组 (8主轴 + 8副轴) -->
        <g stroke-linecap="round">
          <!-- 主放射长线 -->
          <line x1="110" y1="110" x2="110" y2="18" stroke="url(#fwGoldLine)" stroke-width="2.5" />
          <line x1="110" y1="110" x2="175" y2="45" stroke="url(#fwRedLine)" stroke-width="2" />
          <line x1="110" y1="110" x2="202" y2="110" stroke="url(#fwGoldLine)" stroke-width="2.5" />
          <line x1="110" y1="110" x2="175" y2="175" stroke="url(#fwRedLine)" stroke-width="2" />
          <line x1="110" y1="110" x2="110" y2="202" stroke="url(#fwGoldLine)" stroke-width="2.5" />
          <line x1="110" y1="110" x2="45" y2="175" stroke="url(#fwRedLine)" stroke-width="2" />
          <line x1="110" y1="110" x2="18" y2="110" stroke="url(#fwGoldLine)" stroke-width="2.5" />
          <line x1="110" y1="110" x2="45" y2="45" stroke="url(#fwRedLine)" stroke-width="2" />

          <!-- 次级中长射线 -->
          <line x1="110" y1="110" x2="148" y2="24" stroke="url(#fwGoldLine)" stroke-width="1.8" />
          <line x1="110" y1="110" x2="196" y2="72" stroke="url(#fwGoldLine)" stroke-width="1.8" />
          <line x1="110" y1="110" x2="196" y2="148" stroke="url(#fwGoldLine)" stroke-width="1.8" />
          <line x1="110" y1="110" x2="148" y2="196" stroke="url(#fwGoldLine)" stroke-width="1.8" />
          <line x1="110" y1="110" x2="72" y2="196" stroke="url(#fwGoldLine)" stroke-width="1.8" />
          <line x1="110" y1="110" x2="24" y2="148" stroke="url(#fwGoldLine)" stroke-width="1.8" />
          <line x1="110" y1="110" x2="24" y2="72" stroke="url(#fwGoldLine)" stroke-width="1.8" />
          <line x1="110" y1="110" x2="72" y2="24" stroke="url(#fwGoldLine)" stroke-width="1.8" />

          <!-- 外围优雅弧形焰火拖尾 -->
          <path d="M 110 110 Q 135 60 170 30" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
          <path d="M 110 110 Q 170 85 215 95" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
          <path d="M 110 110 Q 160 155 195 200" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
          <path d="M 110 110 Q 85 170 65 215" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
          <path d="M 110 110 Q 55 140 25 170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
          <path d="M 110 110 Q 60 65 30 35" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
        </g>

        <!-- 射线端点珠宝星光与菱形星芒 (Diamond Sparkles & Golden Dots) -->
        <g fill="#f59e0b">
          <circle cx="110" cy="18" r="4.5" fill="#fde047" />
          <circle cx="175" cy="45" r="3.5" fill="#ef4444" />
          <circle cx="202" cy="110" r="4.5" fill="#fde047" />
          <circle cx="175" cy="175" r="3.5" fill="#ef4444" />
          <circle cx="110" cy="202" r="4.5" fill="#fde047" />
          <circle cx="45" cy="175" r="3.5" fill="#ef4444" />
          <circle cx="18" cy="110" r="4.5" fill="#fde047" />
          <circle cx="45" cy="45" r="3.5" fill="#ef4444" />

          <circle cx="148" cy="24" r="3" fill="#f59e0b" />
          <circle cx="196" cy="72" r="3" fill="#f59e0b" />
          <circle cx="196" cy="148" r="3" fill="#f59e0b" />
          <circle cx="148" cy="196" r="3" fill="#f59e0b" />
          <circle cx="72" cy="196" r="3" fill="#f59e0b" />
          <circle cx="24" cy="148" r="3" fill="#f59e0b" />
          <circle cx="24" cy="72" r="3" fill="#f59e0b" />
          <circle cx="72" cy="24" r="3" fill="#f59e0b" />

          <!-- 四角微型钻石星 -->
          <path d="M 110 10 Q 110 18 116 18 Q 110 18 110 26 Q 110 18 104 18 Q 110 18 110 10 Z" fill="#ffffff" />
          <path d="M 202 104 Q 202 110 208 110 Q 202 110 202 116 Q 202 110 196 110 Q 202 110 202 104 Z" fill="#ffffff" />
          <path d="M 170 30 Q 170 34 174 34 Q 170 34 170 38 Q 170 34 166 34 Q 170 34 170 30 Z" fill="#fde047" />
          <path d="M 195 200 Q 195 204 199 204 Q 195 204 195 208 Q 195 204 191 204 Q 195 204 195 200 Z" fill="#fde047" />
        </g>

        <!-- 礼花核心层叠爆炸花蕊 -->
        <circle cx="110" cy="110" r="14" fill="#ffffff" opacity="0.9" />
        <circle cx="110" cy="110" r="8" fill="#fef08a" />
        <circle cx="110" cy="110" r="3.5" fill="#dc2626" />
        <path d="M 110 96 Q 110 110 124 110 Q 110 110 110 124 Q 110 110 96 110 Q 110 110 110 96 Z" fill="#ffffff" />

        <!-- 伴随副花（右上角点缀一朵精巧小花火，高低呼应） -->
        <g transform="translate(130, -10) scale(0.55)" opacity="0.8">
          <circle cx="110" cy="110" r="60" fill="url(#fwCenterGlow)" />
          <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
            <line x1="110" y1="110" x2="110" y2="40" />
            <line x1="110" y1="110" x2="160" y2="60" />
            <line x1="110" y1="110" x2="180" y2="110" />
            <line x1="110" y1="110" x2="160" y2="160" />
            <line x1="110" y1="110" x2="110" y2="180" />
            <line x1="110" y1="110" x2="60" y2="160" />
            <line x1="110" y1="110" x2="40" y2="110" />
            <line x1="110" y1="110" x2="60" y2="60" />
          </g>
          <circle cx="110" cy="40" r="3.5" fill="#ef4444" />
          <circle cx="160" cy="60" r="3.5" fill="#fde047" />
          <circle cx="180" cy="110" r="3.5" fill="#ef4444" />
          <circle cx="160" cy="160" r="3.5" fill="#fde047" />
          <circle cx="110" cy="180" r="3.5" fill="#ef4444" />
          <circle cx="60" cy="160" r="3.5" fill="#fde047" />
          <circle cx="40" cy="110" r="3.5" fill="#ef4444" />
          <circle cx="60" cy="60" r="3.5" fill="#fde047" />
          <circle cx="110" cy="110" r="7" fill="#ffffff" />
        </g>
      </svg>

      <!-- 右下角：传统国潮燃放鞭炮 (Traditional Crackling Festive Firecrackers) -->
      <svg class="decor-item decor-cracker" viewBox="0 0 200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 炮身中国红渐变 -->
          <linearGradient id="paoRedA" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="40%" stop-color="#ef4444" />
            <stop offset="80%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#881337" />
          </linearGradient>
          <linearGradient id="paoRedB" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#991b1b" />
            <stop offset="45%" stop-color="#f87171" />
            <stop offset="85%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#701a1a" />
          </linearGradient>
          <!-- 鎏金箍条渐变 -->
          <linearGradient id="paoGold" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="50%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>
          <!-- 炸裂金光 -->
          <radialGradient id="paoBurst" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="30%" stop-color="#fef08a" stop-opacity="0.9" />
            <stop offset="70%" stop-color="#f97316" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- 顶部中国结编织挂饰 -->
        <g stroke="#991b1b" stroke-width="2.5" stroke-linecap="round">
          <path d="M 100 0 L 100 18" />
        </g>
        <path d="M 100 14 L 112 24 L 100 34 L 88 24 Z" fill="#c8402f" stroke="#b91c1c" stroke-width="1.5" />
        <circle cx="100" cy="24" r="3.5" fill="url(#paoGold)" />
        <path d="M 94 32 L 94 40 M 106 32 L 106 40" stroke="#b45309" stroke-width="1.5" />

        <!-- 盘旋麻绳主引线 -->
        <path d="M 100 36 Q 96 75 103 115 T 97 185 Q 102 220 99 250" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />

        <!-- 串联圆柱炮筒（左右交错排列） -->
        <!-- 炮仗 1（右） -->
        <g transform="translate(102, 45) rotate(22)">
          <path d="M -6 8 L 0 8" stroke="#78350f" stroke-width="1.5" />
          <rect x="0" y="0" width="38" height="15" rx="3.5" fill="url(#paoRedA)" stroke="#7f1d1d" stroke-width="0.7" />
          <rect x="0" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <rect x="31.5" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <circle cx="19" cy="7.5" r="1.8" fill="#fef08a" opacity="0.8" />
        </g>

        <!-- 炮仗 2（左） -->
        <g transform="translate(98, 74) rotate(-22)">
          <path d="M 0 8 L 6 8" stroke="#78350f" stroke-width="1.5" />
          <rect x="-38" y="0" width="38" height="15" rx="3.5" fill="url(#paoRedB)" stroke="#7f1d1d" stroke-width="0.7" />
          <rect x="-38" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <rect x="-6.5" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <circle cx="-19" cy="7.5" r="1.8" fill="#fef08a" opacity="0.8" />
        </g>

        <!-- 炮仗 3（右） -->
        <g transform="translate(101, 104) rotate(20)">
          <path d="M -6 8 L 0 8" stroke="#78350f" stroke-width="1.5" />
          <rect x="0" y="0" width="38" height="15" rx="3.5" fill="url(#paoRedA)" stroke="#7f1d1d" stroke-width="0.7" />
          <rect x="0" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <rect x="31.5" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <circle cx="19" cy="7.5" r="1.8" fill="#fef08a" opacity="0.8" />
        </g>

        <!-- 炮仗 4（左） -->
        <g transform="translate(99, 134) rotate(-24)">
          <path d="M 0 8 L 6 8" stroke="#78350f" stroke-width="1.5" />
          <rect x="-38" y="0" width="38" height="15" rx="3.5" fill="url(#paoRedB)" stroke="#7f1d1d" stroke-width="0.7" />
          <rect x="-38" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <rect x="-6.5" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <circle cx="-19" cy="7.5" r="1.8" fill="#fef08a" opacity="0.8" />
        </g>

        <!-- 炮仗 5（右） -->
        <g transform="translate(102, 164) rotate(22)">
          <path d="M -6 8 L 0 8" stroke="#78350f" stroke-width="1.5" />
          <rect x="0" y="0" width="38" height="15" rx="3.5" fill="url(#paoRedA)" stroke="#7f1d1d" stroke-width="0.7" />
          <rect x="0" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <rect x="31.5" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <circle cx="19" cy="7.5" r="1.8" fill="#fef08a" opacity="0.8" />
        </g>

        <!-- 炮仗 6（左） -->
        <g transform="translate(98, 194) rotate(-20)">
          <path d="M 0 8 L 6 8" stroke="#78350f" stroke-width="1.5" />
          <rect x="-38" y="0" width="38" height="15" rx="3.5" fill="url(#paoRedB)" stroke="#7f1d1d" stroke-width="0.7" />
          <rect x="-38" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <rect x="-6.5" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <circle cx="-19" cy="7.5" r="1.8" fill="#fef08a" opacity="0.8" />
        </g>

        <!-- 炮仗 7（右） -->
        <g transform="translate(101, 224) rotate(18)">
          <path d="M -6 8 L 0 8" stroke="#78350f" stroke-width="1.5" />
          <rect x="0" y="0" width="38" height="15" rx="3.5" fill="url(#paoRedA)" stroke="#7f1d1d" stroke-width="0.7" />
          <rect x="0" y="0" width="6.5" height="15" fill="url(#paoGold)" />
          <rect x="31.5" y="0" width="6.5" height="15" fill="url(#paoGold)" />
        </g>

        <!-- 底部燃放爆心、光芒与纸屑 (Detonation Burst & Flying Confetti) -->
        <g transform="translate(99, 266)">
          <!-- 炸裂球形光晕 -->
          <circle cx="0" cy="0" r="48" fill="url(#paoBurst)" />

          <!-- 多角放射爆炸星芒 -->
          <polygon points="0,-32 7,-10 30,-16 13,2 32,16 9,12 16,32 -2,14 -16,30 -11,10 -30,14 -12,-2 -28,-16 -7,-9" fill="#fef08a" />
          <polygon points="0,-18 4,-6 18,-9 8,1 20,10 5,7 10,20 -1,9 -10,18 -7,6 -18,8 -8,-1 -16,-9 -4,-5" fill="#ffffff" />

          <!-- 飞溅的红色金纸碎片 (Confetti Petals) -->
          <rect x="-30" y="-20" width="8" height="6" rx="1.5" fill="#ef4444" transform="rotate(30 -30 -20)" />
          <rect x="24" y="-26" width="7" height="5" rx="1.5" fill="#dc2626" transform="rotate(-35 24 -26)" />
          <rect x="32" y="8" width="8" height="5" rx="1.5" fill="#f59e0b" transform="rotate(15 32 8)" />
          <rect x="-36" y="12" width="7" height="6" rx="1.5" fill="#b91c1c" transform="rotate(-55 -36 12)" />
          <rect x="-14" y="26" width="6" height="5" rx="1" fill="#ea580c" transform="rotate(40 -14 26)" />
          <rect x="20" y="24" width="7" height="5" rx="1" fill="#fde047" transform="rotate(-20 20 24)" />

          <!-- 散落火星圆点 -->
          <circle cx="-22" cy="-12" r="2.5" fill="#fde047" />
          <circle cx="20" cy="-15" r="3" fill="#ffffff" />
          <circle cx="-12" cy="-30" r="2" fill="#f59e0b" />
          <circle cx="14" cy="-28" r="2" fill="#fde047" />
          <circle cx="34" cy="-3" r="2.5" fill="#fbbf24" />
          <circle cx="-30" cy="2" r="2.5" fill="#ffffff" />
          <circle cx="26" cy="18" r="2" fill="#f59e0b" />
          <circle cx="-20" cy="20" r="2.5" fill="#fde047" />
          <circle cx="8" cy="36" r="2" fill="#ffffff" />
        </g>
      </svg>
    </div>
    <div id="app">加载中…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
