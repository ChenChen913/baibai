<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回顾页 - 拜拜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #FFF8EE 0%, #FFE9D4 100%);
            color: #5A3A2A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .paper-canvas {
            background-color: #FAFAFA;
            background-image:
                radial-gradient(#E8A23D 0.5px, transparent 0.5px),
                radial-gradient(#E8A23D 0.5px, #FAFAFA 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-attachment: fixed;
            position: relative;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .gold-stripe {
            width: 3px;
            height: 1rem;
            background-color: #E8A23D;
            border-radius: 2px;
        }

        .trajectory-base {
            stroke: #C8402F;
            stroke-opacity: 0.2;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
        }

        .trajectory-active {
            stroke: #C8402F;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 5s linear forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        .chip-active {
            background: linear-gradient(135deg, #C8402F 0%, #A62D22 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(200, 64, 47, 0.2);
        }
    </style>
</head>
<body class="p-4">

    <!-- 顶栏 -->
    <header class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
            <button class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/50 text-[#5A3A2A]">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="font-black text-lg">2024-02-10 · 拜年复盘</h1>
        </div>
        <button class="bg-[#C8402F] text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg">
            三线对比
        </button>
    </header>

    <!-- 回放画布卡 -->
    <section class="paper-canvas w-full h-[320px] rounded-[32px] shadow-inner mb-6 overflow-hidden flex items-center justify-center">
        <!-- 模拟轨迹 SVG -->
        <svg viewBox="0 0 200 120" class="w-full h-full p-8">
            <path d="M20,60 Q50,20 80,60 T140,60 T180,60" class="trajectory-base" />
            <path id="active-path" d="M20,60 Q50,20 80,60 T140,60 T180,60" class="trajectory-active" />

            <!-- 家标记 -->
            <circle cx="20" cy="60" r="6" fill="#E8A23D" stroke="white" stroke-width="2" />

            <!-- 户节点 -->
            <g transform="translate(80,60)">
                <circle r="4" fill="white" stroke="#C8402F" stroke-width="1.5" />
                <text y="15" text-anchor="middle" font-size="6" font-weight="bold" fill="#5A3A2A">大伯家</text>
            </g>
            <g transform="translate(140,60)">
                <circle r="4" fill="white" stroke="#C8402F" stroke-width="1.5" />
                <text y="15" text-anchor="middle" font-size="6" font-weight="bold" fill="#5A3A2A">二叔家</text>
            </g>

            <!-- 行进光点 -->
            <circle r="3" fill="white" stroke="#E8A23D" stroke-width="1.5">
                <animateMotion dur="5s" repeatCount="indefinite">
                    <mpath href="#active-path"/>
                </animateMotion>
            </circle>
        </svg>

        <!-- 播放控制行 -->
        <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between px-2">
            <div class="flex items-center gap-3">
                <button class="w-8 h-8 rounded-full bg-[#C8402F] text-white flex items-center justify-center text-xs">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="text-[#5A3A2A]/40 text-[10px] font-bold">重置</button>
                <div class="flex gap-2">
                    <span class="text-[9px] font-black text-[#C8402F]">1x</span>
                    <span class="text-[9px] font-black text-[#5A3A2A]/20">2x</span>
                </div>
            </div>
            <span class="text-[10px] font-bold tabular-nums text-[#5A3A2A]/60">0分45秒 / 12分20秒</span>
        </div>
    </section>

    <!-- 收拾区 (卡片分组) -->
    <div class="space-y-4 mb-8">
        <!-- 户名与收拾 -->
        <section class="glass-card rounded-[24px] p-5 shadow-sm">
            <div class="flex items-center gap-2 mb-4">
                <div class="gold-stripe"></div>
                <h3 class="text-sm font-black text-[#5A3A2A]">户名与收拾</h3>
            </div>

            <div class="space-y-3">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-black text-[#5A3A2A]/30 tabular-nums">01</span>
                    <input type="text" placeholder="起个名（如大伯家）" value="大伯家" class="flex-1 min-w-0 bg-white/80 border border-[#FFE9D4] rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-[#C8402F]">
                    <button class="w-24 py-2 rounded-xl bg-[#5A3A2A]/10 text-[#5A3A2A]/40 text-xs font-black">已改</button>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-black text-[#5A3A2A]/30 tabular-nums">02</span>
                    <input type="text" placeholder="起个名（如二叔家）" class="flex-1 min-w-0 bg-white/80 border border-[#FFE9D4] rounded-xl px-4 py-2 text-sm focus:outline-none">
                    <button class="w-24 py-2 rounded-xl bg-[#C8402F] text-white text-xs font-black shadow-md">改名</button>
                </div>
            </div>
        </section>

        <!-- 异常跳变点 -->
        <section class="glass-card rounded-[24px] p-5 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <div class="gold-stripe"></div>
                    <h3 class="text-sm font-black text-[#5A3A2A]">异常跳变点</h3>
                </div>
                <button class="text-[10px] font-bold text-[#E8A23D] bg-[#E8A23D]/10 px-3 py-1 rounded-full">剔除全部 (2)</button>
            </div>
            <div class="space-y-2">
                <div class="flex items-center justify-between bg-white/40 p-3 rounded-xl border border-white/40">
                    <span class="text-[11px] font-medium tabular-nums opacity-60">10:42 · 精度 142m</span>
                    <button class="text-[#5A3A2A]/30 text-[10px] font-bold">剔除</button>
                </div>
            </div>
        </section>

        <!-- 漏访检查 -->
        <section class="glass-card rounded-[24px] p-5 shadow-sm">
            <div class="flex items-center gap-2 mb-4">
                <div class="gold-stripe"></div>
                <h3 class="text-sm font-black text-[#5A3A2A]">漏访检查</h3>
            </div>
            <div class="flex items-center gap-2 text-[#C8402F]">
                <i class="fa-solid fa-circle-exclamation text-xs"></i>
                <p class="text-xs font-black">疑似漏访 1 户</p>
            </div>
            <div class="mt-3 flex items-center justify-between bg-[#C8402F]/5 p-3 rounded-xl border border-[#C8402F]/10">
                <span class="text-sm font-black text-[#C8402F]">三姑家 没去！</span>
                <span class="text-[10px] font-medium text-[#C8402F]/40">(无坐标户追加)</span>
            </div>
        </section>
    </div>

    <!-- 底部固定栏 (可选或随页面滚动) -->
    <div class="mt-auto pb-4">
        <p class="text-[10px] text-center text-[#5A3A2A]/30 font-medium">提示：拜完年后系统自动对比漏了谁</p>
    </div>

</body>
</html>
