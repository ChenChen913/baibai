<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 拜拜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #FFF8EE 0%, #FFE9D4 100%);
            color: #5A3A2A;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="p-4">
    <header class="flex items-center gap-3 mb-6">
        <button class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/50"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="font-black text-xl">历史记录</h1>
    </header>

    <div class="flex items-center gap-3 mb-6">
        <button class="flex-1 py-3 rounded-xl bg-[#C8402F] text-white font-bold text-xs">导出 JSON</button>
        <button class="flex-1 py-3 rounded-xl border border-[#C8402F] text-[#C8402F] font-bold text-xs">导入 JSON</button>
    </div>
    <p class="text-[10px] font-medium opacity-40 mb-6 px-1">导出/导入与网页版同一格式：安卓记录 → 电脑复盘</p>

    <div class="space-y-4">
        <!-- 历史卡片 -->
        <div class="glass-card rounded-[24px] p-5 flex justify-between items-center">
            <div>
                <h3 class="font-black text-base mb-1">2024-02-10</h3>
                <p class="text-xs font-bold opacity-60">15 户 · 4.32 km · 绕路率 12%</p>
            </div>
            <i class="fa-solid fa-chevron-right text-[#5A3A2A]/20"></i>
        </div>
        <div class="glass-card rounded-[24px] p-5 flex justify-between items-center">
            <div>
                <h3 class="font-black text-base mb-1">2023-01-22</h3>
                <p class="text-xs font-bold opacity-60">12 户 · 3.80 km · 绕路率 8%</p>
            </div>
            <i class="fa-solid fa-chevron-right text-[#5A3A2A]/20"></i>
        </div>
    </div>
</body>
</html>
