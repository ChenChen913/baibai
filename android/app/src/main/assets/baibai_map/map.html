<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<link rel="stylesheet" href="leaflet.css"/>
<style>
  html, body, #map { margin:0; padding:0; width:100%; height:100%; background:#F4F1EA; }
  .home-pin, .node-pin {
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-weight:800; color:#fff; font-family:sans-serif;
    box-shadow:0 3px 8px rgba(90,58,42,.3);
  }
  .home-pin { width:30px; height:30px; background:linear-gradient(135deg,#E8A23D,#D49130); font-size:14px; }
  .node-pin { width:26px; height:26px; background:linear-gradient(135deg,#C8402F,#A62D22); font-size:12px; }
  .baibai-node-icon, .baibai-home-icon { background:transparent; border:none; }
  .attribution {
    position:absolute; right:0; bottom:0; z-index:1000; font-size:10px;
    color:rgba(90,58,42,.5); background:rgba(255,255,255,.6);
    padding:1px 6px; border-radius:8px 0 0 0; pointer-events:none;
  }
  .layer-switch { position:absolute; top:10px; right:10px; z-index:1000; display:flex; gap:6px; }
  .layer-switch button {
    border:0; border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700;
    background:rgba(255,255,255,.94); color:#5A3A2A; box-shadow:0 2px 8px rgba(90,58,42,.18);
  }
  .layer-switch button.on {
    background:linear-gradient(135deg,#C8402F,#A62D22); color:#fff;
  }
  /* P6：地图失败可见兜底浮层（高德+OSM 全部失败时显示） */
  .map-error-overlay {
    position:absolute; left:0; right:0; top:0; bottom:0; z-index:2000;
    display:none; align-items:center; justify-content:center; pointer-events:none;
  }
  .map-error-card {
    max-width:78%; background:rgba(255,251,243,.97); color:#5A3A2A;
    border:1px solid rgba(90,58,42,.15); border-radius:14px; padding:14px 18px;
    font-size:13px; font-weight:700; line-height:1.7; text-align:center;
    box-shadow:0 6px 20px rgba(90,58,42,.18); pointer-events:auto;
  }
  .map-error-card b { color:#C8402F; }
  .map-error-card .hint { font-size:11px; font-weight:500; opacity:.7; }
  /* 诊断徽标（左上角）：真机无需 logcat 即可看到瓦片加载状态，定位"地图不显示"根因 */
  .map-debug {
    position:absolute; left:8px; top:8px; z-index:1500;
    background:rgba(255,255,255,.92); color:#5A3A2A; border:1px solid rgba(90,58,42,.18);
    border-radius:8px; padding:4px 8px; font-size:10px; font-weight:700; line-height:1.5;
    font-family:monospace; max-width:60%; word-break:break-all; pointer-events:none;
    box-shadow:0 1px 4px rgba(90,58,42,.12);
  }
  .map-debug .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
<div id="map"></div>
<div id="map-debug" class="map-debug"><span class="dot" style="background:#999"></span>页面加载中…</div>
<div class="layer-switch">
  <button id="btn-street" class="on">地图</button>
  <button id="btn-sat">卫星</button>
</div>
<div class="attribution">© 高德地图 / OpenStreetMap</div>
<div id="map-error" class="map-error-overlay">
  <div class="map-error-card">
    ⚠️ <b>地图暂不可用</b><br/>
    请检查网络，或点上方「预载」提前缓存周边<br/>
    <span class="hint">轨迹与拜访记录不受影响，仍会正常保存</span>
  </div>
</div>
<script src="leaflet.js"></script>
<script>
(function () {
  var map = L.map('map', { zoomControl:false, attributionControl:false, center:[36.71,119.1], zoom:14 });

  /* ---------- 容器尺寸自适应（解决 Android WebView 初始 0 尺寸不加载瓦片问题） ---------- */
  function ensureSize() {
    try {
      if (map) map.invalidateSize({ pan: false });
    } catch (e) {}
  }
  window.addEventListener('resize', ensureSize);
  setTimeout(ensureSize, 100);
  setTimeout(ensureSize, 400);
  setTimeout(ensureSize, 1000);
  if (typeof ResizeObserver !== 'undefined') {
    var ro = new ResizeObserver(function () { ensureSize(); });
    ro.observe(document.getElementById('map'));
  }

  /* ---------- WGS-84 → GCJ-02（高德瓦片是火星坐标，定位是 WGS-84，必须转换） ---------- */
  var PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
  function outOfChina(lat, lng) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
  function tLat(x, y) {
    var r = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20.0*Math.sin(6.0*x*PI) + 20.0*Math.sin(2.0*x*PI)) * 2.0/3.0;
    r += (20.0*Math.sin(y*PI) + 40.0*Math.sin(y/3.0*PI)) * 2.0/3.0;
    r += (160.0*Math.sin(y/12.0*PI) + 320*Math.sin(y*PI/30.0)) * 2.0/3.0;
    return r;
  }
  function tLng(x, y) {
    var r = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20.0*Math.sin(6.0*x*PI) + 20.0*Math.sin(2.0*x*PI)) * 2.0/3.0;
    r += (20.0*Math.sin(x*PI) + 40.0*Math.sin(x/3.0*PI)) * 2.0/3.0;
    r += (150.0*Math.sin(x/12.0*PI) + 300.0*Math.sin(x/30.0*PI)) * 2.0/3.0;
    return r;
  }
  function wgs2gcj(lat, lng) {
    if (outOfChina(lat, lng)) return [lat, lng];
    var dLat = tLat(lng - 105.0, lat - 35.0);
    var dLng = tLng(lng - 105.0, lat - 35.0);
    var radLat = lat / 180.0 * PI;
    var magic = Math.sin(radLat);
    magic = 1 - EE * magic * magic;
    var sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
    dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
    return [lat + dLat, lng + dLng];
  }
  var useGcj = true; // 高德瓦片=GCJ；回退 OSM 时切回 WGS
  function cvt(p) {
    if (!useGcj) return [p[0], p[1]];
    return wgs2gcj(p[0], p[1]);
  }

  /* ---------- 图层：普通地图（高德→OSM 兜底）+ 卫星（高德） ---------- */
  var street = null, sat = null, curLayer = 'street';
  var streetSrc = 0, streetErr = 0, satErr = 0;
  var streetOk = 0; // 街道层成功瓦片计数（看门狗专用，不受卫星层干扰）

  /* ---------- 诊断徽标（真机可见，定位"地图不显示"根因，无需 logcat） ---------- */
  var dbg = { ok: 0, fail: 0, src: '高德', layer: 'street', t0: Date.now() };
  var dbgEl = document.getElementById('map-debug');
  function dbgDot(color) { return '<span class="dot" style="background:' + color + '"></span>'; }
  function updateDebug(status) {
    if (!dbgEl) return;
    var color = dbg.fail > 0 && dbg.ok === 0 ? '#C8402F' : (dbg.ok > 0 ? '#3DA35D' : '#E8A23D');
    var src = dbg.layer === 'sat' ? '卫星' : dbg.src;
    var line = dbgDot(color) + src + ' ' + (status || (dbg.ok > 0 ? '加载中' : '等待')) +
      ' | OK ' + dbg.ok + ' 失败 ' + dbg.fail;
    dbgEl.innerHTML = line;
  }
  updateDebug('页面已加载·等待瓦片');

  /* ---------- P6：地图失败可见兜底（高德+OSM 均失败时显示，替代"无声空白"） ---------- */
  var mapErrorEl = document.getElementById('map-error');
  var mapErrorShown = false;
  function showMapError() {
    if (mapErrorShown || !mapErrorEl) return;
    mapErrorShown = true;
    mapErrorEl.style.display = 'flex';
    console.warn('[BaibaiMap] 地图瓦片全部失败，显示兜底提示');
  }
  function hideMapError() {
    if (!mapErrorShown || !mapErrorEl) return;
    mapErrorShown = false;
    mapErrorEl.style.display = 'none';
  }

  function makeStreet() {
    var isGaode = streetSrc === 0;
    var url = isGaode
      ? 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}'
      : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    var opts = { maxZoom: 19 };
    if (isGaode) opts.subdomains = '1234';
    var layer = L.tileLayer(url, opts);
    // P4：成功/失败都打日志；成功即重置错误计数并隐藏兜底浮层（P6）
    layer.on('tileload', function () {
      streetErr = 0;
      streetOk++;
      dbg.ok++; updateDebug();
      // 街道层（高德或 OSM）瓦片成功即表示底图可用，隐藏兜底浮层——
      // 不能只看 streetSrc===1，否则"卫星失败→切回高德街道成功"后浮层会永远不消失
      if (curLayer === 'street') hideMapError();
    });
    layer.on('tileerror', function (e) {
      streetErr += 1;
      dbg.fail++; updateDebug();
      console.warn('[BaibaiMap] 街道瓦片失败 #' + streetErr + '：' +
        (e && e.tile && e.tile.src ? e.tile.src : 'unknown'));
      if (streetErr > 6 && streetSrc === 0) {
        console.warn('[BaibaiMap] 高德街道瓦片连续失败，回退 OSM');
        streetSrc = 1;
        streetErr = 0;
        dbg.src = 'OSM'; updateDebug('回退OSM');
        useGcj = false; // OSM 是 WGS-84，切回原坐标
        map.removeLayer(layer);
        makeStreet();
        redrawAll();
        return;
      }
      if (streetErr > 6 && streetSrc === 1) showMapError();
    });
    street = layer;
    if (curLayer === 'street') street.addTo(map);
  }

  function makeSat() {
    sat = L.tileLayer(
      'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      { maxZoom: 19, subdomains: '1234' },
    );
    // P4：卫星层无兜底源，失败打日志；连续失败且当前在卫星层时显示兜底浮层（P6）
    sat.on('tileload', function () {
      satErr = 0;
      dbg.ok++; updateDebug();
      if (curLayer === 'sat') hideMapError();
    });
    sat.on('tileerror', function (e) {
      satErr += 1;
      dbg.fail++; updateDebug();
      console.warn('[BaibaiMap] 卫星瓦片失败 #' + satErr + '：' +
        (e && e.tile && e.tile.src ? e.tile.src : 'unknown'));
      if (satErr > 6 && curLayer === 'sat') showMapError();
    });
    if (curLayer === 'sat') sat.addTo(map);
  }

  function syncButtons() {
    var b1 = document.getElementById('btn-street');
    var b2 = document.getElementById('btn-sat');
    if (!b1 || !b2) return;
    b1.className = curLayer === 'street' ? 'on' : '';
    b2.className = curLayer === 'sat' ? 'on' : '';
  }
  document.getElementById('btn-street').addEventListener('click', function () {
    if (sat && map.hasLayer(sat)) map.removeLayer(sat);
    if (street) street.addTo(map);
    curLayer = 'street';
    dbg.layer = 'street'; updateDebug('切街道');
    syncButtons();
  });
  document.getElementById('btn-sat').addEventListener('click', function () {
    if (street && map.hasLayer(street)) map.removeLayer(street);
    if (sat) sat.addTo(map);
    curLayer = 'sat';
    dbg.layer = 'sat'; updateDebug('切卫星');
    syncButtons();
  });

  makeStreet();
  makeSat();
  syncButtons();

  /* ---------- 看门狗：页面加载 10s 内街道层 0 张成功 → 立即回退 OSM ----------
   * 原回退要攒够 6 次 tileerror；拦截层阻塞/弱网下 error 事件来得极慢，地图长时间空白。
   * 只看 streetOk（不含卫星层），避免误判。 */
  setTimeout(function () {
    if (streetSrc === 0 && streetOk === 0) {
      console.warn('[BaibaiMap] 10 秒内街道瓦片零成功，提前回退 OSM');
      streetSrc = 1;
      streetErr = 0;
      dbg.src = 'OSM'; updateDebug('回退OSM');
      useGcj = false;
      if (street) map.removeLayer(street);
      makeStreet();
      redrawAll();
    }
  }, 10000);

  /* ---------- 轨迹（分段：走过=淡红，当前段=实红粗线，像导航一样实时增长） ---------- */
  var rawTrack = [];      // WGS-84 [[lat,lng],...]
  var segBreaks = [0];
  var lastT = 0;
  var segGroup = L.layerGroup().addTo(map);

  function drawSegments() {
    segGroup.clearLayers();
    for (var i = 0; i < segBreaks.length; i++) {
      var a = segBreaks[i];
      var b = (i + 1 < segBreaks.length) ? segBreaks[i + 1] : rawTrack.length;
      if (b - a < 2) continue;
      var pts = [];
      for (var k = a; k < b; k++) pts.push(cvt(rawTrack[k]));
      var isCurrent = (i === segBreaks.length - 1);
      L.polyline(pts, {
        color: '#C8402F',
        weight: isCurrent ? 5 : 4,
        opacity: isCurrent ? 0.95 : 0.35,
        lineJoin: 'round',
      }).addTo(segGroup);
    }
  }

  /* ---------- 当前位置点 + 精度圈 ---------- */
  var me = null, accCircle = null;
  function drawMe(lat, lng, acc) {
    var c = cvt([lat, lng]);
    if (!me) {
      me = L.circleMarker(c, {
        radius: 9, color: '#ffffff', weight: 2.5, fillColor: '#C8402F', fillOpacity: 1,
      }).addTo(map);
    } else {
      me.setLatLng(c);
    }
    if (accCircle) { map.removeLayer(accCircle); accCircle = null; }
    if (acc && acc > 0) {
      accCircle = L.circle(c, {
        radius: acc, color: '#C8402F', weight: 1, fillColor: '#C8402F', fillOpacity: 0.07, interactive: false,
      }).addTo(map);
    }
  }

  /* ---------- 家/户标记 ---------- */
  var rawHome = null, rawNodes = [];
  var nodeGroup = null;
  function drawNodes() {
    var layer = L.layerGroup();
    if (rawHome && (rawHome.lat !== 0 || rawHome.lng !== 0)) {
      var hc = cvt([rawHome.lat, rawHome.lng]);
      L.marker(hc, {
        icon: L.divIcon({ className: 'baibai-home-icon', html: '<div class="home-pin">家</div>', iconSize: [30,30], iconAnchor: [15,15] }),
        zIndexOffset: 200,
      }).addTo(layer);
    }
    for (var i = 0; i < rawNodes.length; i++) {
      var n = rawNodes[i];
      var nc = cvt([n.lat, n.lng]);
      var m = L.marker(nc, {
        icon: L.divIcon({ className: 'baibai-node-icon', html: '<div class="node-pin">' + n.n + '</div>', iconSize: [26,26], iconAnchor: [13,13] }),
        zIndexOffset: 150,
      });
      if (n.name) {
        var label = document.createElement('div');
        label.textContent = n.name;
        m.bindTooltip(label, { direction: 'top', offset: [0, -14] });
      }
      m.addTo(layer);
    }
    if (nodeGroup) map.removeLayer(nodeGroup);
    nodeGroup = layer;
    layer.addTo(map);
  }

  function redrawAll() {
    drawSegments();
    drawNodes();
    if (me) {
      var p = me.getLatLng();
      drawMe(p.lat, p.lng, 0);
    }
  }

  window.BaibaiMap = {
    // 强制触发一次尺寸刷新与重算
    invalidateSize: function () {
      ensureSize();
    },

    // 追加最新定位点（按时间戳去重），视野跟随当前位置，当前段实时增长
    follow: function (lat, lng, acc, t) {
      ensureSize();
      if (!isFinite(lat) || !isFinite(lng)) return;
      if (t && t === lastT) return;
      lastT = t || 0;
      rawTrack.push([lat, lng]);
      drawSegments();
      drawMe(lat, lng, acc);
      map.setView(cvt([lat, lng]), Math.max(map.getZoom(), 16), { animate: true });
    },

    // 只显示当前位置（开始拜年前的等待期：还没轨迹，先看到自己在哪）
    locate: function (lat, lng, acc) {
      ensureSize();
      if (!isFinite(lat) || !isFinite(lng)) return;
      drawMe(lat, lng, acc);
      map.setView(cvt([lat, lng]), Math.max(map.getZoom(), 16), { animate: true });
    },

    // P7：仅移动视野不画点（IDLE 态把地图中心放到用户上次的位置）
    center: function (lat, lng, zoom) {
      ensureSize();
      if (!isFinite(lat) || !isFinite(lng)) return;
      map.setView(cvt([lat, lng]), zoom || 14, { animate: false });
    },

    // 整条轨迹 + 段起点下标（恢复/继续/重新展开时全量同步）
    setTrack: function (pts, breaks) {
      ensureSize();
      lastT = 0;
      rawTrack = [];
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        if (p && isFinite(p[0]) && isFinite(p[1])) rawTrack.push([p[0], p[1]]);
      }
      segBreaks = (breaks && breaks.length) ? breaks.slice() : [0];
      drawSegments();
      if (rawTrack.length > 1) {
        var bounds = [];
        for (var k = 0; k < rawTrack.length; k++) bounds.push(cvt(rawTrack[k]));
        map.fitBounds(L.latLngBounds(bounds).pad(0.25));
      }
    },

    // 家（金）+ 户（红圈数字，悬浮户名）
    setNodes: function (home, nodes) {
      ensureSize();
      rawHome = home || null;
      rawNodes = nodes || [];
      drawNodes();
    },
  };
})();
</script>
</body>
</html>
